name: create-skill
# Flagship dogfood: skill-creator-plus triggers on a "create a skill" request and runs under
# Cowork's real sandbox without leaking host paths or blowing a cost budget.
#
# LIVE-ONLY — intentionally NOT recorded to a committed cassette. A full skill-creation run
# produces a binary `.skill` artifact (an un-scannable zip) and surfaces the skill's own
# instructional text (agentskills.io / Claude.ai domains); committing that to a public repo would
# mean shipping an un-scannable blob and broadening the verify-cassettes allowlist beyond the single
# sanctioned `claude.com` entry. It's also non-deterministic (LLM-authored gates). So run it live
# (or in the deferred nightly lane), not on the token-free replay lane. Verified locally: records +
# replays ✓, host-path guard ✓. See harness/README.md § "What a live run checks".
#
# Why on_unanswered: llm (not scripted answers): the skill's Capture-Intent gates are
# LLM-authored and REWORDED every run (observed: "large or messy CSVs" -> "larger or messier
# CSVs", option labels and even the sub-question count change run-to-run). Exact scripted
# `choose:` labels therefore hard-fail on the next run. The gate *choices* are immaterial to the
# assertions below (which only require the skill to run and produce a SKILL.md), so per the harness
# guidance we let an LLM decider answer them. The recorded cassette is flagged NON-DETERMINISTIC
# but replays byte-deterministically — fine for the replay regression lane.
#
# COVERAGE GAP (see harness/README.md § "Known coverage gap: script output paths"): a green run here
# does NOT certify that a bundled script's output path reached the user. No tier reproduces
# production's bash-vs-file-tool cwd split; `container` persists the write where production
# discards it.
session: ../sessions/skill.yaml
fidelity: container            # required for transcript_no_host_path (fails by design on protocol/hostloop)
on_unanswered: llm
timeout_ms: 1200000

prompt: |
  Create a skill that converts CSV files to markdown tables, then package it
  and give me the resulting .skill file.

assert:
  # Structural / boundary keys — robust to phrasing drift.
  - result: success                          # agent didn't error (NOT "task complete" — see content assert below)
  - skill_triggered: "skill-creator-plus"    # the skill actually ran (content-class; replay-checkable)
  - transcript_no_host_path: true            # no /Users, /opt/cowork, /home, /root leaked (live-only; container)
  # Budget guards — the full create -> test -> eval -> package loop fans out subagents / tools.
  # ~22 tools, ~130s observed predates the packaging step being asked for in the prompt above (the
  # prompt used to stop at "create a skill"); it's real historical data for the shorter run, not a
  # budget for the whole loop measured here. max_cost_usd raised to match remote-delivery.yaml,
  # which exercises the same shape of run (create + package).
  - max_cost_usd: 12.0
  - max_tokens: 2000000
  # Content signal that real work happened (never rely on result:success alone).
  - transcript_matches: "SKILL\\.md"
  # Runtime guard for the 0.7.0 stdlib-only fix (LIVE/verify-run ONLY; skipped-loud on replay).
  # A bundled script importing a module the image lacks throws ModuleNotFoundError wherever egress
  # is denied (`import yaml` specifically no longer would — PyYAML is preinstalled — but the
  # stdlib-only rule from 0.7.0 stands: the skill must not depend on image contents). check_portability /
  # analyze-skill catch this statically; this catches a regression at *runtime*, which is the whole
  # reason the dogfood exists. Note: evaluated per captured tool result under a 10 KB/result cap; a
  # no-match against a truncated result reports could-not-verify, not a silent pass. Regex targets
  # actual Python error signatures, not prose mentioning them.
  # NEEDS cowork-harness >= 1.2.0 for `tool_result_not_matches` (3.10.0 is what this repo pins).
  # Why this assertion is worth keeping even though the image DOES ship a large Python stack
  # (numpy/pandas/requests/PyYAML/bs4/openpyxl/Pillow/matplotlib/python-docx/python-pptx) and CAN
  # install from PyPI, both probed live 2026-08-05: a module outside that stack still throws under
  # an org that denies egress, and any Traceback here is a real regression whatever its cause.
  - tool_result_not_matches: "ModuleNotFoundError|No module named '(yaml|[a-z0-9_]+)'|Traceback \\(most recent call last\\)"
  # Runtime F3 guard (delivery contract). The skill's own rule is that a written path is not
  # delivery where a surfacing tool exists — "if one exists you MUST call it". This lane serves
  # `present_files`, so a correct run calls it. Content-class, evidence-backed
  # (RunResult.presentedFiles); asserts the harness-side delivery record, and names no tool in the
  # skill itself. Valid at `fidelity: container` or `hostloop` (present_files is served at both).
  # VERIFIED LIVE at `container` — observed passing, so a red here is a signal, not an open question
  # about the assertion. Note the suite's first live run passed all eight asserts and still FAILED,
  # on the `outputs-delete` guard: assertions and guards fail independently, so read both.
  - present_files_called: true
