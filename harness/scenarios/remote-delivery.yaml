name: remote-delivery
# Runtime guard for the remote-lane delivery contract (finding F3 — the skill's own rule that a
# written path is not delivery where a surfacing tool exists).
#
# WHY THIS EXISTS: on Cowork's remote lane, location delivers nothing — the session runs in a
# sandbox reclaimed at session end, and `present_files` is not served there. A skill that writes
# its deliverable and only states the path silently loses it. Every static check we have
# (check_portability's delivery-* rules, analyze-skill) reasons about *authored text*; this is the
# only check that observes the runtime behaviour of our own packaging step.
#
# WHY NO `user_visible_artifact`: that key is rejected at LOAD time on `lane: remote` — on that lane
# it could only ever report "cannot verify". We assert the delivery *attempt* in the transcript
# instead, which is what the harness's own rejection message directs you to do.
#
# LIVE-ONLY — deliberately not recorded to a committed cassette (same reasoning as create-skill.yaml:
# non-deterministic LLM-authored gates, and a binary .skill artifact). CI only load-checks this file
# via `record --dry-run`; a human runs it on demand. Never gate a PR on it.
#
# NEEDS cowork-harness >= 1.14.0 for `lane:` (>= 3.2.0 is what this repo pins). On an older CLI
# this scenario does not load at all — it is NOT silently treated as `lane: local`.
session: ../sessions/skill.yaml
lane: remote                   # the delivery contract under test
fidelity: container
on_unanswered: llm             # gates are LLM-authored and reworded run-to-run; see create-skill.yaml
timeout_ms: 1200000

prompt: |
  Create a skill that converts CSV files to markdown tables, then package it
  and give me the resulting .skill file.

assert:
  - result: success
  - skill_triggered: "skill-creator-plus"
  # WHY `semantic_matches` and not a transcript regex: the harness's judged document is assistant
  # text + the final message + any files the agent authored (`transcript.push` only fires on
  # `assistant_text` events) — the judge CANNOT see tool calls at all, on any lane. On top of that,
  # `lane: remote` serves no delivery tool: not `present_files` (rejected by design on this lane)
  # and not `SendUserFile` (deliberately not emulated — fidelity to the lane, not a gap; see
  # fidelity-gaps.md). So a rubric claim of the shape "used a tool / announced no tool exists" is
  # either unobservable (tool use) or narration our skill never asks the agent to produce
  # (an explicit "no such tool exists" statement) — it would red a correct run and grade identically
  # on a broken one. The gradeable signal on this lane is *where the file ended up and whether that
  # location was communicated*, not whether a tool was invoked.
  # OBSERVED PASSING (2/2 rubric claims) — but read what that does and does not mean, because this
  # is the assertion most likely to be over-read.
  #
  # What passed: the GRADEABLE signal — the agent wrote the .skill to an explicitly stated,
  # user-reachable location and told the user where. Judged by rubric.
  # What is still NOT measured: whether anything reached the user. `delivery_unobservable` fires on
  # every run here — nothing is delivered by location on this lane, and the harness models no remote
  # delivery tool (production uses the agent-native SendUserFile). The run's delivery behaviour is
  # UNMEASURED, not clean. That warning is deliberately not suppressed: `allow_undelivered_deliverables`
  # would silence it, and in the one scenario whose whole purpose is the delivery contract that would
  # mean "I accept this is unverifiable" — the most honest thing the harness can say here.
  #
  # So this green is weaker than its sibling's. `create-skill.yaml` verifies the LOCAL lane with
  # evidence (`present_files_called`, RunResult.presentedFiles). This verifies that the skill BEHAVES
  # as the rule requires on the remote lane; it cannot verify the delivery landed. Do not read either
  # green as covering the other lane.
  # COVERAGE GAP, and this scenario is where it bites (harness/README.md § "Known coverage gap:
  # script output paths"): `containedPath` blocks `file_exists`/`user_visible_artifact`/
  # `computer_links_resolve` from ever seeing a stray bash write, so the exposed assertion classes
  # are `semantic_matches` and `no_lost_write_back` — and this scenario grades entirely via the
  # former. Precisely: a rubric item like "wrote the file to a stated location" grades TRUE on a
  # file that production would discard. Narrow claim, deliberately: not "artifact assertions can be
  # faked", which is false and was withdrawn upstream.
  - semantic_matches:
      rubric:
        - "The agent packaged the skill and produced a .skill file."
        - "The agent wrote the packaged .skill file to an explicitly stated, user-reachable
           location (for example a workspace or outputs directory) and told the user that
           location — rather than leaving it only in a scratch/working directory or referring to
           it vaguely."
  - max_cost_usd: 12.0
  - max_tokens: 2000000
  # NO `allow_undelivered_deliverables` here, deliberately — and note this reverses an earlier
  # decision taken against 1.16.0 behaviour. Back then the WARN fired on every remote run regardless
  # of what the skill did (the `presentedFiles` arm is structurally always empty on a lane that
  # serves no delivery tool), so suppressing it removed pure noise. 1.17.0 fixed that: a
  # `deliveryObservable()` predicate now gates the signal, and the sibling `delivery_unobservable`
  # WARN states the gap honestly instead of guessing.
  #
  # The key's meaning changed with it. On `lane: remote` it ALSO suppresses `delivery_unobservable`,
  # so asserting it now means "I accept that delivery is unverifiable here" — which, in the one
  # scenario whose entire purpose is the delivery contract, would silence the most honest thing the
  # harness can tell us.
  #
  # Precisely: on this lane only ONE of the pair can fire. `isDeliveryEvidenceUsable` returns false
  # when the lane is remote, so `undelivered_deliverables` is unreachable here (the harness's own
  # source marks that arm UNREACHABLE). What remains is `delivery_unobservable`, and its conditions
  # — remote lane, workspace files present, at least one non-input file — do not vary with skill
  # behaviour, so it is a CONSTANT on every passing run, not a signal. It is warn-only and cannot
  # fail the run. We leave it audible not because it discriminates but so the coverage gap stays on
  # the record instead of being papered over by a modifier that now means something stronger.
  #
  # WHY NO `file_exists` FOR THE `.skill`, despite the load-time rejection message recommending
  # exactly that: `file_exists` resolves a LITERAL path under the work root (`containedPath`) — it
  # does not glob, and no glob-capable existence key exists in the assertion set. Both the skill's
  # name and its output directory are model-chosen here, and *choosing a user-reachable location is
  # the thing under test*; pinning either in the prompt to make a literal path assertable would
  # delete the behaviour being measured. Known residual weakness, stated rather than hidden: rubric
  # item 1 ("packaged the skill and produced a .skill file") is an action claim the judge can only
  # read narration about, so a run that says it packaged and did not would grade green on that item.
  # Fixing it needs a glob-capable existence assertion the harness does not currently offer
  # (requested; see docs/internal/2026-08-28-cowork-harness-feature-requests.md §3).
  #
  # CROSS-CHECK, so this reads as a bounded hole rather than an open one: rubric item 1 is the ONLY
  # unverified half, and it is covered elsewhere. `create-skill.yaml` exercises the same packaging
  # step on the LOCAL lane and asserts it with EVIDENCE — `present_files_called`, backed by
  # RunResult.presentedFiles — observed passing there. So "did this skill actually package a .skill"
  # is answered by the sibling; what this scenario uniquely tests is whether the agent writes it to
  # a stated, user-reachable location and says where, on a lane where location delivers nothing.
  #
  # What the cross-check does NOT cover, and nothing currently does: whether the file reached the
  # user on the remote lane. That is `delivery_unobservable`, and it is unmeasurable here by design
  # — not a gap this assertion or the glob key would close.
