# Token-free, Docker-free static lane for cowork-harness: lint + static analysis
# of the skill and harness scenarios, plus cassette verify/replay once cassettes
# exist. The live `run` (container fidelity) lane is a separate, deferred,
# self-hosted-runner concern documented in harness/README.md.
name: Cowork Harness (static)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  harness-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # cowork-harness >= 4.2.1 declares engines node >= 22

      - name: Install cowork-harness (pinned)
        run: |
          npm i --prefix "$RUNNER_TEMP/ch" cowork-harness@4.2.1
          echo "$RUNNER_TEMP/ch/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify cowork-harness version
        run: |
          V=$(cowork-harness --version | tail -1)
          echo "cowork-harness $V"
          # The pin lives TWICE in this job — the npm install above and this assert. Move both.
          case "$V" in 4.2.*) ;; *) echo "expected 4.2.x, got $V"; exit 1;; esac

      - name: Lint skill (strict)
        run: |
          cowork-harness lint-skill --strict skill-creator-plus/skills/skill-creator-plus

      - name: Analyze skill (strict)
        run: |
          cowork-harness analyze-skill --strict skill-creator-plus/skills/skill-creator-plus

      - name: Lint harness scenarios
        run: |
          # --strict --min-severity WARN per cowork-harness 1.18.0: without --strict the step
          # CANNOT fail on a WARN-class rule (it prints and exits 0), and bare --strict also
          # fails on advisory INFO. Both flags are required for this gate to gate.
          cowork-harness lint --strict --min-severity WARN harness/scenarios/

      - name: Load-check scenarios (token-free)
        run: |
          # `lint` only WARNS on an UNKNOWN KEY, so a scenario that lints clean can still be
          # unloadable — a green lint is not evidence the suite runs. (Since 3.2.0 lint IS the
          # stricter check for one class: an invalid ENUM value is an ERROR. Unknown keys stay a
          # warning, so this loader pass is still the gate.) No token, no Docker, writes nothing.
          # LIMITS of the directory arm: it is NOT recursive (a scenario in a subdirectory is
          # silently unchecked), and a `prompt:`-less file reports as *skipped*, not broken.
          # cowork-harness >= 1.16.0.
          cowork-harness record harness/scenarios/ --dry-run --quiet

      - name: Verify + replay cassettes (if any)
        run: |
          # --allow-empty (1.17.0) greens an EXISTING but cassette-free dir; a MISSING path still
          # exits 2, so it cannot green a typo. `replay` still needs the guard, so the branch stays.
          # No allowlist flags — cowork-harness >=1.16.0 no longer emits the benign claude.com
          # MCP-handshake false positive that once required --allow-domain. Any finding is real.
          cowork-harness verify-cassettes harness/cassettes --allow-empty
          if ls harness/cassettes/*.cassette.json >/dev/null 2>&1; then
            cowork-harness replay harness/cassettes
          else
            echo "No cassettes found — expected at least no-trigger.cassette.json. If it was removed deliberately, fine; otherwise the replay gate is silently absent. See harness/README.md."
          fi
